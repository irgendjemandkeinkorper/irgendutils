name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_tests: ${{ steps.set-matrix.outputs.has_tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for accurate git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard sensitive tracked files
        run: node scripts/check-sensitive-files.mjs

      - name: Run Package Detector
        id: set-matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE_REF: ${{ github.event.before }}
        run: |
          node scripts/detect-ci-matrix.mjs

  test:
    name: test (${{ matrix.package }})
    needs: detect
    if: ${{ needs.detect.outputs.has_tests == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: |
          if [ "${{ matrix.language }}" = "python" ]; then
            python -m pip install --disable-pip-version-check --no-input -r requirements.txt 2>/dev/null || true
          elif [ -f package-lock.json ]; then
            echo "Found package-lock.json, running npm ci"
            npm ci
          else
            echo "No package-lock.json found, running npm install"
            npm install
          fi

      - name: Install Playwright browser
        if: ${{ matrix.language == 'node' }}
        run: |
          if grep -q '"playwright"' package.json; then
            npx playwright install chromium
          fi

      - name: Run tests
        run: |
          if [ "${{ matrix.language }}" = "python" ]; then
            PKG="${{ matrix.package }}"
            cd "$GITHUB_WORKSPACE"
            if [ -d "$PKG/src" ]; then export PYTHONPATH="$GITHUB_WORKSPACE/$PKG/src:$GITHUB_WORKSPACE/$PKG:$PYTHONPATH"; fi
            if [ -d "$PKG/tests" ]; then TEST_DIR=tests; else TEST_DIR=test; fi
            python -m unittest discover -s "$PKG/$TEST_DIR" -p 'test_*.py'
          else
            npm test
          fi
