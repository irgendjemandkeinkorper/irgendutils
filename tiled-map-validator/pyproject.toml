[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiled-map-validator"
version = "1.0.0"
description = "A zero-dependency Python Tiled map and tileset validator for 2D games"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Jules", email = "jules@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
tiled-map-validator = "tiled_map_validator.cli:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiled_map_validator*"]
